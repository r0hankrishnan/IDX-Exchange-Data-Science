[project]
name = "idx-exchange-data-science"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "r0hankrishnan", email = "125333525+r0hankrishnan@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "catboost>=1.2.10",
    "geopandas>=1.2.0",
    "ipykernel>=7.4.0",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "shap>=0.54.1",
    "streamlit>=1.67.0",
    "structured-data-models>=0.2.1",
    "xgboost>=3.4.1",
]

[project.scripts]
idx-exchange-data-science = "idx_exchange_data_science:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
